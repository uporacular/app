<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>UpOracular | Hub de Maturidade Full-Stack</title>
  <meta name="description" content="Hub unificado de maturidade UpOracular — orquestração e integração entre backend GAS e frontend HTML.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">

  <style>
    /* ── Tokens de Design Premium ──────────────────────── */
    :root {
      --bg: #15171c;
      --surface:      rgba(10, 20, 38, 0.96);
      --card:         rgba(16, 30, 58, 0.75);
      --card-hover:   rgba(24, 44, 82, 0.90);
      --glass-border: rgba(139, 92, 246, 0.2);
      --glass-hi:     rgba(255, 255, 255, 0.03);
      --text:         #e2edf8;
      --text-muted:   #8aa2c1;
      --text-dim:     #4d6991;
      --accent: #7aa2d6;   /* indigo */
      --accent-be: #9ec5e8;   /* cyan for backend */
      --accent-fe: #b2c8e4;   /* light purple for frontend */
      --success:      #34d399;
      --warn: #d9b271;
      --danger:       #f87171;
      --glow-hub:     rgba(129, 140, 248, 0.25);
      --glow-be:      rgba(56, 189, 248, 0.2);
      --glow-fe:      rgba(192, 132, 252, 0.2);
      --radius-sm:    8px;
      --radius-md:    14px;
      --radius-lg:    20px;
      --transition:   all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 14px; scroll-behavior: smooth; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
      background-image:
        radial-gradient(ellipse at 30% 0%,   rgba(129,140,248,0.12) 0px, transparent 50%),
        radial-gradient(ellipse at 70% 100%, rgba(56,189,248,0.08) 0px, transparent 50%);
    }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(129,140,248,0.25); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(129,140,248,0.4); }

    .container { max-width: 960px; margin: 0 auto; padding: 1.5rem 1.25rem 3rem; }

    /* ── Header ─────────────────────────────────────── */
    .page-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 1.75rem;
      animation: fadeInDown 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .header-left { display: flex; align-items: center; gap: 0.85rem; }
    .header-icon {
      width: 48px; height: 48px; flex-shrink: 0;
      border-radius: var(--radius-md);
      background: linear-gradient(135deg, rgba(129,140,248,0.2), rgba(56,189,248,0.15));
      border: 1px solid rgba(129,140,248,0.3);
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 8px 24px -6px var(--glow-hub);
    }
    .header-icon .material-icons { font-size: 26px; color: var(--accent); }
    .header-text h1 {
      font-size: 1.35rem; font-weight: 700; letter-spacing: -0.02em;
      background: linear-gradient(135deg, var(--text), var(--accent));
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .header-text p { font-size: 0.78rem; color: var(--text-muted); margin-top: 2px; }
    
    .header-badge {
      display: inline-flex; align-items: center; gap: 0.3rem;
      padding: 0.25rem 0.6rem; border-radius: var(--radius-sm);
      font-size: 0.7rem; font-weight: 600;
      background: rgba(129,140,248,0.1);
      border: 1px solid rgba(129,140,248,0.22);
      color: var(--accent);
    }

    /* ── Loading Panel ───────────────────────────────── */
    .loading-panel {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 1rem; padding: 4rem 1rem; text-align: center;
    }
    .loading-ring {
      width: 58px; height: 58px; border-radius: 50%;
      border: 3px solid rgba(129,140,248,0.15);
      border-top-color: var(--accent);
      animation: spin 0.9s cubic-bezier(0.5, 0.1, 0.5, 0.9) infinite;
    }
    .loading-text { color: var(--text-muted); font-size: 0.9rem; font-weight: 500; }
    .loading-sub  { font-size: 0.75rem; color: var(--text-dim); max-width: 280px; line-height: 1.6; }

    /* ── Combined Hero Panel ────────────────────────── */
    .hero-panel {
      background: var(--card);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-lg);
      padding: 1.75rem; margin-bottom: 1.5rem;
      position: relative; overflow: hidden;
      animation: fadeInUp 0.5s ease-out 0.1s both;
    }
    .hero-panel::before {
      content: ''; position: absolute; inset: 0;
      background: radial-gradient(circle at 100% 0%, rgba(129,140,248,0.08), transparent 60%);
      pointer-events: none;
    }
    .hero-layout {
      display: flex; align-items: center; gap: 2rem;
    }

    /* Circular Score Gauge */
    .hero-gauge-container {
      position: relative; flex-shrink: 0; width: 130px; height: 130px;
    }
    .hero-gauge-container svg { width: 130px; height: 130px; transform: rotate(-90deg); }
    .gauge-bg { fill: none; stroke: rgba(129,140,248,0.08); stroke-width: 8; }
    .gauge-arc {
      fill: none; stroke-width: 8; stroke-linecap: round;
      transition: stroke-dashoffset 1.5s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .gauge-center {
      position: absolute; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
    }
    .gauge-score {
      font-size: 2.1rem; font-weight: 700; line-height: 1;
      background: linear-gradient(135deg, var(--text), var(--accent));
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .gauge-label { font-size: 0.65rem; color: var(--text-muted); margin-top: 2px; letter-spacing: 0.05em; text-transform: uppercase; }

    .hero-info { flex: 1; }
    .hero-level-line { display: flex; align-items: center; gap: 0.6rem; margin-bottom: 0.4rem; }
    .hero-level { font-size: 1.1rem; font-weight: 700; }
    .hero-desc { font-size: 0.8rem; color: var(--text-muted); line-height: 1.55; margin-bottom: 1rem; }
    
    /* Subscores layout */
    .hero-subscores { display: flex; gap: 1.25rem; flex-wrap: wrap; }
    .subscore-card {
      display: flex; align-items: center; gap: 0.75rem;
      padding: 0.5rem 0.85rem; border-radius: var(--radius-md);
      background: rgba(255,255,255,0.02);
      border: 1px solid rgba(255,255,255,0.04);
      flex: 1; min-width: 140px;
    }
    .subscore-value { font-size: 1.25rem; font-weight: 700; line-height: 1; }
    .subscore-meta { display: flex; flex-direction: column; }
    .subscore-label { font-size: 0.65rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.05em; }
    .subscore-level { font-size: 0.75rem; font-weight: 500; margin-top: 1px; }

    /* ── Tabs Bar ───────────────────────────────────── */
    .tabs {
      display: flex; gap: 0.5rem; margin: 1.5rem 0 1rem;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      padding-bottom: 0.5rem;
      overflow-x: auto;
    }
    .tab {
      padding: 0.5rem 1rem; border-radius: var(--radius-sm);
      font-size: 0.78rem; font-weight: 600;
      cursor: pointer; border: none; font-family: inherit;
      background: transparent; color: var(--text-muted);
      transition: var(--transition);
      display: flex; align-items: center; gap: 0.4rem;
      white-space: nowrap;
    }
    .tab:hover { background: rgba(129,140,248,0.08); color: var(--text); }
    .tab.active {
      background: rgba(129,140,248,0.15);
      border: 1px solid rgba(129,140,248,0.28);
      color: var(--accent);
    }
    .tab .material-icons { font-size: 16px; }

    /* Tab Panels */
    .tab-panel { display: none; }
    .tab-panel.active { display: block; animation: fadeIn 0.35s ease-out; }

    /* ── Tab: Geral (Dashboard Overview) ─────────────── */
    .dashboard-grid { display: grid; grid-template-columns: 1.5fr 1fr; gap: 1rem; }
    @media (max-width: 768px) {
      .dashboard-grid { grid-template-columns: 1fr; }
      .hero-layout { flex-direction: column; text-align: center; }
      .hero-subscores { justify-content: center; }
    }

    .panel-card {
      background: var(--card);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-md);
      padding: 1.25rem; margin-bottom: 1rem;
      position: relative;
    }
    .card-title {
      font-size: 0.82rem; font-weight: 600; text-transform: uppercase;
      letter-spacing: 0.05em; color: var(--text-muted);
      margin-bottom: 1rem; display: flex; align-items: center; gap: 0.4rem;
    }
    .card-title .material-icons { font-size: 18px; color: var(--accent); }

    /* Stats Blocks */
    .stats-row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; margin-bottom: 1rem; }
    .stat-box {
      background: rgba(255,255,255,0.02);
      border: 1px solid rgba(255,255,255,0.04);
      border-radius: var(--radius-sm);
      padding: 0.85rem; text-align: center;
    }
    .stat-val { font-size: 1.6rem; font-weight: 700; line-height: 1; }
    .stat-label { font-size: 0.7rem; color: var(--text-muted); margin-top: 0.4rem; }

    /* Gap Distribution list */
    .distribution-list { display: flex; flex-direction: column; gap: 0.5rem; }
    .dist-row { display: flex; align-items: center; justify-content: space-between; font-size: 0.78rem; padding: 0.35rem 0.5rem; border-radius: 6px; background: rgba(255,255,255,0.01); }
    .dist-name { display: flex; align-items: center; gap: 0.4rem; color: var(--text-muted); }
    .dist-count { font-weight: 700; color: var(--text); }
    .dot { width: 6px; height: 6px; border-radius: 50%; }

    /* Alignment Widget */
    .alignment-widget { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 1.5rem; text-align: center; }
    .alignment-bar-container { width: 100%; height: 8px; background: rgba(255,255,255,0.05); border-radius: 4px; position: relative; margin: 1rem 0; overflow: hidden; }
    .alignment-bar-fill { height: 100%; background: linear-gradient(90deg, var(--accent-be), var(--accent), var(--accent-fe)); border-radius: 4px; transition: width 1s ease; }
    .alignment-val { font-size: 1.4rem; font-weight: 700; color: var(--success); }
    .alignment-lbl { font-size: 0.75rem; color: var(--text-muted); margin-top: 0.2rem; }

    /* ── Tab: Matrix ────────────────────────────────── */
    .matrix-toolbar {
      display: flex; gap: 0.75rem; align-items: center; justify-content: space-between;
      margin-bottom: 1rem; flex-wrap: wrap;
    }
    .search-box {
      position: relative; flex: 1; min-width: 200px;
    }
    .search-box input {
      width: 100%; padding: 0.5rem 0.75rem 0.5rem 2.2rem;
      background: var(--card); border: 1px solid var(--glass-border);
      border-radius: var(--radius-sm); color: var(--text);
      font-family: inherit; font-size: 0.78rem; outline: none;
      transition: var(--transition);
    }
    .search-box input:focus { border-color: var(--accent); box-shadow: 0 0 10px rgba(129,140,248,0.15); }
    .search-box .material-icons { position: absolute; left: 0.75rem; top: 50%; transform: translateY(-50%); font-size: 16px; color: var(--text-dim); }
    
    .filter-group { display: flex; gap: 0.35rem; }
    .filter-btn {
      padding: 0.35rem 0.75rem; border-radius: var(--radius-sm);
      font-size: 0.72rem; font-weight: 600; font-family: inherit;
      cursor: pointer; border: 1px solid rgba(255,255,255,0.05);
      background: rgba(255,255,255,0.02); color: var(--text-muted);
      transition: var(--transition);
    }
    .filter-btn:hover { background: rgba(255,255,255,0.05); color: var(--text); }
    .filter-btn.active { background: rgba(129,140,248,0.12); border-color: rgba(129,140,248,0.25); color: var(--accent); }

    /* Module Matrix Table styling */
    .matrix-table-container {
      background: var(--card); border: 1px solid var(--glass-border);
      border-radius: var(--radius-md); overflow-x: auto;
    }
    .matrix-table {
      width: 100%; border-collapse: collapse; text-align: left;
      font-size: 0.78rem;
    }
    .matrix-table th {
      padding: 0.85rem 1rem; font-weight: 600; color: var(--text-dim);
      border-bottom: 1px solid rgba(255,255,255,0.06);
      text-transform: uppercase; letter-spacing: 0.05em; font-size: 0.65rem;
      cursor: pointer; user-select: none;
    }
    .matrix-table th:hover { color: var(--text-muted); }
    .matrix-table td {
      padding: 0.85rem 1rem; border-bottom: 1px solid rgba(255,255,255,0.03);
      vertical-align: middle; transition: var(--transition);
    }
    .matrix-table tr:hover td { background: rgba(255,255,255,0.015); }
    
    .module-name-cell { font-weight: 600; color: var(--text); display: flex; flex-direction: column; gap: 2px; }
    .module-tag-row { display: flex; gap: 0.25rem; flex-wrap: wrap; margin-top: 2px; }
    .mini-tag { font-size: 0.58rem; padding: 1px 4px; border-radius: 3px; font-weight: 600; }
    .tag-core { background: rgba(129,140,248,0.1); border: 1px solid rgba(129,140,248,0.2); color: var(--accent); }
    .tag-pipeline { background: rgba(56,189,248,0.1); border: 1px solid rgba(56,189,248,0.2); color: var(--accent-be); }
    
    .score-badge-inline {
      display: inline-flex; align-items: center; justify-content: center;
      width: 32px; height: 32px; font-weight: 700; font-size: 0.75rem;
    }
    .score-be { background: rgba(56,189,248,0.08); border: 1px solid rgba(56,189,248,0.2); color: var(--accent-be); }
    .score-fe { background: rgba(192,132,252,0.08); border: 1px solid rgba(192,132,252,0.2); color: var(--accent-fe); }
    .score-fe.null-fe { background: transparent; border: 1px dashed rgba(255,255,255,0.08); color: var(--text-dim); }

    .gap-badge {
      display: inline-flex; align-items: center; gap: 2px;
      padding: 0.2rem 0.5rem; border-radius: 6px;
      font-weight: 600; font-size: 0.7rem;
    }
    .gap-be-lead { background: rgba(248,113,113,0.08); border: 1px solid rgba(248,113,113,0.2); color: var(--danger); }
    .gap-fe-lead { background: rgba(56,189,248,0.08); border: 1px solid rgba(56,189,248,0.2); color: var(--accent-be); }
    .gap-balanced { background: rgba(52,211,153,0.08); border: 1px solid rgba(52,211,153,0.2); color: var(--success); }
    .gap-none     { background: transparent; color: var(--text-dim); }

    /* ── Tab: Insights ──────────────────────────────── */
    .insights-container { display: flex; flex-direction: column; gap: 0.75rem; }
    .insight-card {
      background: var(--card); border: 1px solid var(--glass-border);
      border-radius: var(--radius-md); padding: 1.1rem;
      display: flex; gap: 0.85rem; align-items: flex-start;
      transition: var(--transition);
      animation: fadeInUp 0.4s ease-out both;
    }
    .insight-card:hover { transform: translateY(-2px); background: var(--card-hover); }
    
    .insight-icon-box {
      width: 36px; height: 36px; border-radius: var(--radius-sm);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .insight-icon-box.good { background: rgba(52,211,153,0.1); border: 1px solid rgba(52,211,153,0.22); color: var(--success); }
    .insight-icon-box.warn { background: rgba(251,191,36,0.1); border: 1px solid rgba(251,191,36,0.22); color: var(--warn); }
    .insight-icon-box.info { background: rgba(56,189,248,0.1); border: 1px solid rgba(56,189,248,0.22); color: var(--accent-be); }
    
    .insight-content { flex: 1; }
    .insight-hdr { font-size: 0.85rem; font-weight: 600; margin-bottom: 0.35rem; color: var(--text); }
    .insight-body { font-size: 0.76rem; color: var(--text-muted); line-height: 1.5; }

    /* ── Tab: Recommendations (Ações) ────────────────── */
    .recs-container { display: flex; flex-direction: column; gap: 0.6rem; }
    .rec-card {
      background: var(--card); border: 1px solid var(--glass-border);
      border-radius: var(--radius-md); padding: 1.1rem;
      display: flex; gap: 1rem; align-items: flex-start;
      transition: var(--transition);
    }
    .rec-card:hover { background: var(--card-hover); }
    .rec-badge-impact {
      font-size: 0.58rem; padding: 2px 6px; border-radius: 4px;
      font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em;
      flex-shrink: 0; margin-top: 2px;
    }
    .impact-high { background: rgba(248,113,113,0.1); border: 1px solid rgba(248,113,113,0.22); color: var(--danger); }
    .impact-medium { background: rgba(251,191,36,0.1); border: 1px solid rgba(251,191,36,0.22); color: var(--warn); }
    .impact-low { background: rgba(56,189,248,0.1); border: 1px solid rgba(56,189,248,0.22); color: var(--accent-be); }
    
    .rec-main { flex: 1; }
    .rec-label { font-size: 0.65rem; font-weight: 600; text-transform: uppercase; color: var(--text-dim); margin-bottom: 0.25rem; letter-spacing: 0.03em; }
    .rec-text { font-size: 0.78rem; color: var(--text-muted); line-height: 1.5; }

    /* ── Action bar ─────────────────────────────────── */
    .action-bar { display: flex; gap: 0.75rem; margin-top: 1.75rem; flex-wrap: wrap; justify-content: space-between; }
    .action-bar-left { display: flex; gap: 0.6rem; }
    
    .btn {
      display: inline-flex; align-items: center; gap: 0.4rem;
      padding: 0.6rem 1.1rem; border-radius: var(--radius-sm);
      font-family: inherit; font-size: 0.78rem; font-weight: 600;
      cursor: pointer; border: none; transition: var(--transition);
      user-select: none;
    }
    .btn-primary {
      background: linear-gradient(135deg, rgba(129,140,248,0.22), rgba(56,189,248,0.18));
      color: var(--accent); border: 1px solid rgba(129,140,248,0.3);
      box-shadow: 0 4px 16px -4px var(--glow-hub);
    }
    .btn-primary:hover {
      background: linear-gradient(135deg, rgba(129,140,248,0.35), rgba(56,189,248,0.28));
      box-shadow: 0 6px 20px -3px var(--glow-hub);
    }
    .btn-primary:active { transform: scale(0.97); }
    
    .btn-secondary {
      background: rgba(255,255,255,0.03); color: var(--text-muted);
      border: 1px solid rgba(255,255,255,0.06);
    }
    .btn-secondary:hover { background: rgba(255,255,255,0.07); color: var(--text); }
    .btn-secondary:active { transform: scale(0.97); }
    
    .btn .material-icons { font-size: 16px; }

    /* ── Footer ──────────────────────────────────────── */
    .footer { margin-top: 2.5rem; text-align: center; font-size: 0.68rem; color: var(--text-dim); animation: fadeIn 0.5s ease-out 0.8s both; }

    /* ── Animations ──────────────────────────────────── */
    @keyframes fadeIn     { from { opacity: 0; } to { opacity: 1; } }
    @keyframes fadeInUp   { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes fadeInDown { from { opacity: 0; transform: translateY(-12px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes spin       { to { transform: rotate(360deg); } }
  


/* codex-school-community-ux: ajustes finos para uso recorrente por comunidade escolar */
:root {
  --codex-school-focus: #ffd166;
  --codex-school-touch: 44px;
  --codex-school-radius: 8px;
  --codex-school-field-radius: 7px;
  --codex-school-form-gap: 14px;
  --codex-school-field-border: rgba(120, 132, 156, 0.45);
  --codex-school-field-bg: rgba(255, 255, 255, 0.96);
  --codex-school-field-text: #1f2937;
  --codex-school-muted-text: #64748b;
  --codex-school-soft-surface: rgba(248, 250, 252, 0.82);
  --codex-school-safe-bottom: max(16px, env(safe-area-inset-bottom));
}

:where(html) {
  scroll-behavior: smooth;
  -webkit-text-size-adjust: 100%;
}

:where(body) {
  overscroll-behavior-y: contain;
}

:where(p, li, dd, dt, blockquote, figcaption, label, td, th) {
  line-height: 1.5;
}

:where(main, .main, .content, .page, .app, .app-shell, .container, .dashboard, .workspace) {
  padding-bottom: var(--codex-school-safe-bottom);
}

:where(a, button, .btn, .button, [role="button"], input, select, textarea, summary) {
  min-height: var(--codex-school-touch);
  touch-action: manipulation;
}

:where(button, .btn, .button, [role="button"], input[type="submit"], input[type="button"]) {
  border-radius: var(--codex-school-radius) !important;
  font-weight: 700;
}

:where(a, button, input, select, textarea, summary, [tabindex]):focus-visible {
  outline: 3px solid var(--codex-school-focus) !important;
  outline-offset: 3px !important;
}

:where(label) {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-height: 28px;
  color: var(--codex-gentle-muted, var(--text-muted, var(--codex-school-muted-text)));
  font-weight: 700;
}

:where(form) {
  border-radius: var(--codex-school-radius) !important;
}

:where(fieldset) {
  border-radius: var(--codex-school-radius) !important;
  border-color: var(--codex-school-field-border);
}

:where(legend) {
  padding-inline: 6px;
  font-weight: 700;
}

:where(.form-group, .input-field, .field, .form-field, .control-group) {

    }
    box.dataset.kind = kind === 'err' ? 'err' : 'ok';
    box.textContent = String(message || (kind === 'err' ? 'Nao foi possivel concluir.' : 'Operacao concluida.'));
    box.classList.add('is-visible');
    clearTimeout(timer);
    timer = setTimeout(function () {
      box.classList.remove('is-visible');
    }, 1000);
  }

  function connectLabels(form) {
    form.querySelectorAll('input:not([type="hidden"]), select, textarea').forEach(function (field, index) {
      var id = field.id || ('uo-field-' + index + '-' + Math.random().toString(36).slice(2, 7));
      field.id = id;
      var label = form.querySelector('label[for="' + id + '"]');
      if (!label) {
        var sibling = field.previousElementSibling;
        if (sibling && sibling.tagName === 'LABEL') {
          sibling.htmlFor = id;
          label = sibling;
        }
      }
      if (label && field.parentElement && !field.parentElement.classList.contains('uo-field')) {
        field.parentElement.classList.add('uo-field');
      }
    });
  }

  document.addEventListener('DOMContentLoaded', function () {
    document.querySelectorAll('form').forEach(connectLabels);
  });

  document.addEventListener('submit', function (event) {
    var form = event.target;
    if (!form || form.tagName !== 'FORM') return;
    form.setAttribute('aria-busy', 'true');
    notify('ok', 'Enviando...');
    window.setTimeout(function () {
      if (form.getAttribute('aria-busy') === 'true') {
        form.removeAttribute('aria-busy');
      }
    }, 10000);
  }, true);

  window.UpOracularFeedback = {
    ok: function (message) { notify('ok', message); },
    err: function (message) { notify('err', message); },
    done: function (form, message) {
      if (form) form.removeAttribute('aria-busy');
      notify('ok', message);
    },
    fail: function (form, message) {
      if (form) form.removeAttribute('aria-busy');
      notify('err', message);
    }
  };
}());
</script>

input:not([type="hidden"]),

[class*="input"],

<body>
    <main>

  <div class="container">

    <!-- Header -->
    <div class="page-header">
      <div class="header-left">
        <div class="header-icon">
          <span class="material-icons">analytics</span>
        </div>
        <div class="header-text">
          <h1>Diagnóstico Integrado</h1>
          <p>Maturidade UpOracular · Backend & Frontend Unificados</p>
        </div>
      </div>
      <div class="header-badge">
        <span class="material-icons">verified</span>
        <span>v1.3.0</span>
      </div>
    </div>

    <!-- Content Panel -->
    <div id="content">
      <div class="loading-panel" id="loading-panel">
        <div class="loading-ring"></div>
        <p class="loading-text">Orquestrando diagnóstico full-stack...</p>
        <p class="loading-sub">Analisando o código do backend GAS e o design/UX das telas HTML em paralelo. Por favor, aguarde.</p>
      </div>
    </div>

  </div>

  <script>
    // ── Estado do Aplicativo ─────────────────────────
    var report = null;
    var activeTab = 'geral';
    var matrixSortField = 'name';
    var matrixSortAsc = true;
    var matrixSearchText = '';
    var matrixFilter = 'all';

    // Cores de criticidade de gap
    var GAP_BADGES = {
      'no-ui': '<span class="gap-badge gap-none">Sem Interface</span>',
      'balanced': '<span class="gap-badge gap-balanced">Equilibrado</span>',
      'backend-strong': '<span class="gap-badge gap-be-lead">UI Defasada (BE Lead)</span>',
      'frontend-strong': '<span class="gap-badge gap-fe-lead">GAS Defasado (FE Lead)</span>',
      'both-weak': '<span class="gap-badge gap-be-lead">Ambos Fracos</span>'
    };

    // Boot
    window.addEventListener('load', loadData);

    function loadData() {
      showLoading(true);
      google.script.run
        .withSuccessHandler(onSuccess)
        .withFailureHandler(onError)
        .getUnifiedMaturityJson();
    }

    function showLoading(show) {
      var lp = document.getElementById('loading-panel');
      if (lp) lp.style.display = show ? 'flex' : 'none';
    }

    function onError(err) {
      showLoading(false);
      document.getElementById('content').innerHTML =
        '<div class="panel-card" style="border-color:var(--danger);color:var(--danger)">' +
        '<div style="font-weight:700;margin-bottom:.5rem">Erro na Orquestração do Hub:</div>' +
        '<pre style="white-space:pre-wrap;font-size:.7rem;opacity:.9">' + esc(err.message || String(err)) + '</pre></div>';
    }

    function onSuccess(json) {
      try {
        report = JSON.parse(json);
        if (report.error) { onError(report.error); return; }
        renderHub();
      } catch (e) {
        onError('Falha ao processar o JSON: ' + e.message);
      }
    }

    // Renderizador principal
    function renderHub() {
      showLoading(false);
      var html = '';

      // Hero Panel (Combined Score)
      html += buildHeroPanel();

      // Tab Bar
      html += '<div class="tabs">' +
        '  <button class="tab ' + (activeTab === 'geral' ? 'active' : '') + '" onclick="switchTab(\'geral\')"><span class="material-icons">dashboard</span>Visão Geral</button>' +
        '  <button class="tab ' + (activeTab === 'matriz' ? 'active' : '') + '" onclick="switchTab(\'matriz\')"><span class="material-icons">view_in_ar</span>Matriz de Módulos</button>' +
        '  <button class="tab ' + (activeTab === 'insights' ? 'active' : '') + '" onclick="switchTab(\'insights\')"><span class="material-icons">campaign</span>Insights (' + (report.insights || []).length + ')</button>' +
        '  <button class="tab ' + (activeTab === 'acoes' ? 'active' : '') + '" onclick="switchTab(\'acoes\')"><span class="material-icons">offline_bolt</span>Ações Recomendadas</button>' +
        '</div>';

      // 1. Tab Panel: Geral
      html += '<div class="tab-panel ' + (activeTab === 'geral' ? 'active' : '') + '" id="panel-geral">';
      html += buildTabGeral();
      html += '</div>';

      // 2. Tab Panel: Matrix
      html += '<div class="tab-panel ' + (activeTab === 'matriz' ? 'active' : '') + '" id="panel-matriz">';
      html += buildTabMatriz();
      html += '</div>';

      // 3. Tab Panel: Insights
      html += '<div class="tab-panel ' + (activeTab === 'insights' ? 'active' : '') + '" id="panel-insights">';
      html += buildTabInsights();
      html += '</div>';

      // 4. Tab Panel: Ações
      html += '<div class="tab-panel ' + (activeTab === 'acoes' ? 'active' : '') + '" id="panel-acoes">';
      html += buildTabAcoes();
      html += '</div>';

      // Action Bar
      html += buildActionBar();

      // Footer
      html += '<div class="footer">UpOracular MaturityHub v' + (report.version || '1.0.0') + ' · Gerado em ' + formatTs(report.generatedAt) + '</div>';

      document.getElementById('content').innerHTML = html;

      // Inicia animações e gauges
      setTimeout(function() {
        animateGauges();
        animateBars();
      }, 50);
    }

    // ── Componentes de UI ──────────────────────────────

    function buildHeroPanel() {
      var circ = 2 * Math.PI * 52; // r=52
      return '<div class="hero-panel">' +
        '<div class="hero-layout">' +
        '  <div class="hero-gauge-container">' +
        '    <svg viewBox="0 0 120 120">' +
        '      <circle class="gauge-bg" cx="60" cy="60" r="52"/>' +
        '      <circle class="gauge-arc" id="hub-gauge-arc" cx="60" cy="60" r="52" ' +
        '        stroke="' + (report.levelColor || 'var(--accent)') + '" ' +
        '        stroke-dasharray="' + circ + '" stroke-dashoffset="' + circ + '"/>' +
        '    </svg>' +
        '    <div class="gauge-center">' +
        '      <span class="gauge-score" id="hub-score-num">0</span>' +
        '      <span class="gauge-label">Score</span>' +
        '    </div>' +
        '  </div>' +
        '  <div class="hero-info">' +
        '    <div class="hero-level-line">' +
        '      <span class="hero-level" style="color:' + report.levelColor + '">' + esc(report.level) + '</span>' +
        '    </div>' +
        '    <div class="hero-desc">' + esc(report.description) + '</div>' +
        '    <div class="hero-subscores">' +
        '      <div class="subscore-card" style="border-color:rgba(56,189,248,0.2)">' +
        '        <div class="subscore-value" style="color:var(--accent-be)">' + report.backend.score + '</div>' +
        '        <div class="subscore-meta">' +
        '          <span class="subscore-label">⚙ Backend (55%)</span>' +
        '          <span class="subscore-level" style="color:' + report.backend.levelColor + '">' + report.backend.level.split(' — ')[1] + '</span>' +
        '        </div>' +
        '      </div>' +
        '      <div class="subscore-card" style="border-color:rgba(192,132,252,0.2)">' +
        '        <div class="subscore-value" style="color:var(--accent-fe)">' + report.frontend.score + '</div>' +
        '        <div class="subscore-meta">' +
        '          <span class="subscore-label">🎨 Frontend (45%)</span>' +
        '          <span class="subscore-level" style="color:' + report.frontend.levelColor + '">' + report.frontend.level.split(' — ')[1] + '</span>' +
        '        </div>' +
        '      </div>' +
        '    </div>' +
        '  </div>' +
        '</div></div>';
    }

    function buildTabGeral() {
      var gs = report.gapStats || {};
      var alignment = 100 - gs.avgGap;
      var alignColor = alignment >= 85 ? 'var(--success)' : (alignment >= 65 ? 'var(--warn)' : 'var(--danger)');

      return '<div class="dashboard-grid">' +
        '  <div class="dashboard-col">' +
        '    <div class="panel-card">' +
        '      <div class="card-title"><span class="material-icons">insights</span>Status do Sistema</div>' +
        '      <div class="stats-row">' +
        '        <div class="stat-box"><div class="stat-val" style="color:var(--accent-be)">' + gs.total + '</div><div class="stat-label">Módulos GAS</div></div>' +
        '        <div class="stat-box"><div class="stat-val" style="color:var(--accent-fe)">' + gs.withHtml + '</div><div class="stat-label">Telas HTML</div></div>' +
        '      </div>' +
        '      <div class="distribution-list">' +
        '        <div class="dist-row"><span class="dist-name"><span class="dot" style="background:var(--success)"></span>Módulos Equilibrados</span><span class="dist-count">' + gs.balanced + '</span></div>' +
        '        <div class="dist-row"><span class="dist-name"><span class="dot" style="background:var(--danger)"></span>UI Defasada (BE forte)</span><span class="dist-count">' + gs.backendLead + '</span></div>' +
        '        <div class="dist-row"><span class="dist-name"><span class="dot" style="background:var(--accent-be)"></span>GAS Defasado (FE forte)</span><span class="dist-count">' + gs.frontendLead + '</span></div>' +
        '        <div class="dist-row"><span class="dist-name"><span class="dot" style="background:var(--warn)"></span>Ambos Fracos / Legados</span><span class="dist-count">' + gs.bothWeak + '</span></div>' +
        '      </div>' +
        '    </div>' +
        '  </div>' +
        '  <div class="dashboard-col">' +
        '    <div class="panel-card" style="height:100%">' +
        '      <div class="card-title"><span class="material-icons">sync_alt</span>Alinhamento Full-Stack</div>' +
        '      <div class="alignment-widget">' +
        '        <div class="alignment-val" style="color:' + alignColor + '">' + alignment + '%</div>' +
        '        <div class="alignment-lbl">Coerência de Arquitetura</div>' +
        '        <div class="alignment-bar-container">' +
        '          <div class="alignment-bar-fill" id="alignment-bar" style="width:0%"></div>' +
        '        </div>' +
        '        <p style="font-size:0.75rem;color:var(--text-muted);line-height:1.5;margin-top:0.5rem">' +
        '          Representa o quanto o frontend e backend evoluem de forma coordenada. Gaps médios de ' + gs.avgGap + ' pts detectados.' +
        '        </p>' +
        '      </div>' +
        '    </div>' +
        '  </div>' +
        '</div>';
    }

    function buildTabMatriz() {
      var html = '<div class="matrix-toolbar">' +
        '  <div class="search-box">' +
        '    <span class="material-icons">search</span>' +
        '    <input inputmode="text" type="text" id="matrix-search" placeholder="Buscar módulo ou tela..." oninput="onMatrixSearch(this.value)" value="' + esc(matrixSearchText) + '" autocomplete="name">' +
        '  </div>' +
        '  <div class="filter-group">' +
        '    <button class="filter-btn ' + (matrixFilter === 'all' ? 'active' : '') + '" onclick="filterMatrix(\'all\')">Todos</button>' +
        '    <button class="filter-btn ' + (matrixFilter === 'critical' ? 'active' : '') + '" onclick="filterMatrix(\'critical\')">Críticos</button>' +
        '    <button class="filter-btn ' + (matrixFilter === 'noui' ? 'active' : '') + '" onclick="filterMatrix(\'noui\')">Sem UI</button>' +
        '  </div>' +
        '</div>';

      html += '<div class="matrix-table-container">' +
        '  <table class="matrix-table">' +
        '    <thead>' +
        '      <tr>' +
        '        <th onclick="sortMatrix(\'name\')">Módulo ' + getSortIcon('name') + '</th>' +
        '        <th onclick="sortMatrix(\'beScore\')" style="text-align:center">Backend ' + getSortIcon('beScore') + '</th>' +
        '        <th onclick="sortMatrix(\'feScore\')" style="text-align:center">Frontend ' + getSortIcon('feScore') + '</th>' +
        '        <th onclick="sortMatrix(\'gap\')" style="text-align:center">Gap ' + getSortIcon('gap') + '</th>' +
        '        <th>Criticidade</th>' +
        '      </tr>' +
        '    </thead>' +
        '    <tbody id="matrix-table-body">' +
        '      ' + buildMatrixRows() +
        '    </tbody>' +
        '  </table>' +
        '</div>';

      return html;
    }

    function buildMatrixRows() {
      var list = report.moduleMatrix || [];

      // Filtro de Busca
      if (matrixSearchText) {
        var query = matrixSearchText.toLowerCase();
        list = list.filter(function(m) {
          return m.name.toLowerCase().indexOf(query) >= 0;
        });
      }

      // Filtro de Categoria
      if (matrixFilter === 'critical') {
        list = list.filter(function(m) {
          return m.gapStatus === 'backend-strong' || m.gapStatus === 'frontend-strong' || m.gapStatus === 'both-weak';
        });
      } else if (matrixFilter === 'noui') {
        list = list.filter(function(m) { return !m.hasHtml; });
      }

      // Ordenação
      list.sort(function(a, b) {
        var valA = a[matrixSortField];
        var valB = b[matrixSortField];

        // Trata nulos na ordenação
        if (valA === null) valA = -999;
        if (valB === null) valB = -999;

        if (typeof valA === 'string') {
          return matrixSortAsc ? valA.localeCompare(valB) : valB.localeCompare(valA);
        } else {
          return matrixSortAsc ? valA - valB : valB - valA;
        }
      });

      if (!list.length) {
        return '<tr><td colspan="5" style="text-align:center;color:var(--text-dim);padding:2rem">Nenhum módulo encontrado com os filtros atuais.</td></tr>';
      }

      return list.map(function(m) {
        var beScoreEl = '<span class="score-badge-inline score-be">' + m.beScore + '</span>';
        var feScoreEl = m.hasHtml
          ? '<span class="score-badge-inline score-fe">' + Math.round(m.feScore) + '</span>'
          : '<span class="score-badge-inline score-fe null-fe">—</span>';

        var gapEl = '—';
        if (m.hasHtml) {
          var sign = m.gap > 0 ? '+' : '';
          var gapColor = m.gapStatus === 'balanced' ? 'var(--success)' : 'var(--danger)';
          gapEl = '<span style="font-weight:700;color:' + gapColor + '">' + sign + m.gap + '</span>';
        }

        var tags = '';
        if (m.isCore) tags += '<span class="mini-tag tag-core">Core</span>';
        if (m.isPipeline) tags += '<span class="mini-tag tag-pipeline">Pipeline</span>';

        return '<tr>' +
          '  <td>' +
          '    <div class="module-name-cell">' +
          '      <span>' + esc(m.name) + '</span>' +
          '      <div class="module-tag-row">' + tags + '</div>' +
          '    </div>' +
          '  </td>' +
          '  <td style="text-align:center">' + beScoreEl + '</td>' +
          '  <td style="text-align:center">' + feScoreEl + '</td>' +
          '  <td style="text-align:center">' + gapEl + '</td>' +
          '  <td>' + (GAP_BADGES[m.gapStatus] || m.gapStatus) + '</td>' +
          '</tr>';
      }).join('');
    }

    function buildTabInsights() {
      var insights = report.insights || [];
      if (!insights.length) {
        return '<p style="color:var(--text-dim);text-align:center;padding:2rem">Nenhum insight disponível.</p>';
      }

      return '<div class="insights-container">' +
        insights.map(function(ins) {
          var severityIcon = ins.severity === 'good' ? 'check_circle' : (ins.severity === 'warn' ? 'warning' : 'info');
          return '<div class="insight-card">' +
            '  <div class="insight-icon-box ' + ins.severity + '">' +
            '    <span class="material-icons">' + severityIcon + '</span>' +
            '  </div>' +
            '  <div class="insight-content">' +
            '    <div class="insight-hdr">' + esc(ins.title) + '</div>' +
            '    <div class="insight-body">' + esc(ins.body) + '</div>' +
            '  </div>' +
            '</div>';
        }).join('') + '</div>';
    }

    function buildTabAcoes() {
      var recs = report.integratedRecs || [];
      if (!recs.length) {
        return '<p style="color:var(--text-dim);text-align:center;padding:2rem">Nenhuma recomendação prioritária no momento.</p>';
      }

      return '<div class="recs-container">' +
        recs.map(function(r) {
          return '<div class="rec-card">' +
            '  <span class="rec-badge-impact impact-' + r.impact + '">' + r.impact + '</span>' +
            '  <div class="rec-main">' +
            '    <div class="rec-label">' + esc(r.label) + '</div>' +
            '    <div class="rec-text">' + esc(r.text) + '</div>' +
            '  </div>' +
            '</div>';
        }).join('') + '</div>';
    }

    function buildActionBar() {
      return '<div class="action-bar">' +
        '<div class="action-bar-left">' +
        '  <button class="btn btn-primary" onclick="loadData()"><span class="material-icons">refresh</span>Reanalisar</button>' +
        '  <button class="btn btn-secondary" onclick="openBackendOnly()"><span class="material-icons">settings_suggest</span>Somente Backend</button>' +
        '  <button class="btn btn-secondary" onclick="openFrontendOnly()"><span class="material-icons">palette</span>Somente Frontend</button>' +
        '</div>' +
        '<button class="btn btn-secondary" onclick="copyJson()"><span class="material-icons">content_copy</span>Copiar JSON</button>' +
        '</div>';
    }

    // ── Controladores e Filtros ────────────────────────

    function switchTab(tabId) {
      activeTab = tabId;
      var tabs = document.querySelectorAll('.tab');
      var panels = document.querySelectorAll('.tab-panel');

      tabs.forEach(function(btn, i) {
        var isCurrent = btn.textContent.toLowerCase().indexOf(tabId === 'geral' ? 'geral' : (tabId === 'matriz' ? 'matriz' : (tabId === 'insights' ? 'insights' : 'ações'))) >= 0;
        btn.classList.toggle('active', isCurrent);
      });

      panels.forEach(function(panel) {
        panel.classList.toggle('active', panel.id === 'panel-' + tabId);
      });

      if (tabId === 'geral') {
        setTimeout(animateBars, 100);
      }
    }

    function onMatrixSearch(val) {
      matrixSearchText = val;
      document.getElementById('matrix-table-body').innerHTML = buildMatrixRows();
    }

    function filterMatrix(type) {
      matrixFilter = type;
      var btns = document.querySelectorAll('.filter-btn');
      btns.forEach(function(btn) {
        var match = (type === 'all' && btn.textContent.indexOf('Todos') >= 0) ||
                    (type === 'critical' && btn.textContent.indexOf('Críticos') >= 0) ||
                    (type === 'noui' && btn.textContent.indexOf('Sem UI') >= 0);
        btn.classList.toggle('active', match);
      });
      document.getElementById('matrix-table-body').innerHTML = buildMatrixRows();
    }

    function sortMatrix(field) {
      if (matrixSortField === field) {
        matrixSortAsc = !matrixSortAsc;
      } else {
        matrixSortField = field;
        matrixSortAsc = true;
      }
      document.getElementById('matrix-table-body').innerHTML = buildMatrixRows();
    }

    function getSortIcon(field) {
      if (matrixSortField !== field) return '<span style="opacity:0.3;font-size:10px">▲</span>';
      return matrixSortAsc ? '▲' : '▼';
    }

    // Ações GAS drill-down
    function openBackendOnly() {
      google.script.run.openBackendMaturityPanel();
    }

    function openFrontendOnly() {
      google.script.run.openFrontendMaturityPanel();
    }

    function copyJson() {
      if (!report) return;
      var txt = JSON.stringify(report, null, 2);
      var el = document.createElement('textarea');
      el.value = txt; document.body.appendChild(el);
      el.select(); document.execCommand('copy');
      document.body.removeChild(el);
      toast('JSON de Diagnóstico Copiado!');
    }

    function toast(msg) {
      var t = document.getElementById('_toast');
      if (!t) {
        t = document.createElement('div'); t.id = '_toast';
        t.style.cssText = 'position:fixed;bottom:1.25rem;left:50%;transform:translateX(-50%);background:rgba(10,20,38,0.95);border:1px solid rgba(129,140,248,0.3);color:#e2edf8;padding:.6rem 1.2rem;border-radius:8px;font-size:.75rem;z-index:9999;font-weight:500;box-shadow:0 8px 24px rgba(0,0,0,0.5);transition:opacity 0.3s ease';
        document.body.appendChild(t);
      }
      t.textContent = msg; t.style.opacity = '1';
      clearTimeout(t._timer);
      t._timer = setTimeout(function() { t.style.opacity = '0'; }, 3000);
    }

    // ── Animações Dinâmicas ──────────────────────────

    function animateGauges() {
      var arc = document.getElementById('hub-gauge-arc');
      var num = document.getElementById('hub-score-num');
      if (!arc || !num) return;
      var score = report.combinedScore;
      var circ = 2 * Math.PI * 52;
      arc.style.strokeDashoffset = circ - (score / 100) * circ;
      countUp(num, 0, score, 1400);
    }

    function animateBars() {
      var alignBar = document.getElementById('alignment-bar');
      if (alignBar) {
        var gs = report.gapStats || {};
        var alignment = 100 - gs.avgGap;
        setTimeout(function() { alignBar.style.width = alignment + '%'; }, 50);
      }
    }

    function countUp(el, from, to, duration) {
      var start = null;
      (function step(ts) {
        if (!start) start = ts;
        var p = Math.min((ts - start) / duration, 1);
        var e = 1 - Math.pow(1 - p, 3); // easeOutCubic
        el.textContent = (e * (to - from) + from).toFixed(1);
        if (p < 1) requestAnimationFrame(step);
      })(performance.now());
    }

    function esc(s) {
      return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function formatTs(iso) {
      try {
        var d = new Date(iso);
        return d.toLocaleDateString('pt-BR') + ' às ' + d.toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'});
      } catch(e) { return iso || ''; }
    }
  </script>

<script>
/* codex-school-community-ux-script: pequenos ajustes de contexto escolar */
(function() {
  if (window.__codexSchoolCommunityUx) return;
  window.__codexSchoolCommunityUx = true;

  function ready(fn) {
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', fn, { once: true });
    else fn();
  }

  ready(function() {
    document.documentElement.setAttribute('data-community-context', 'school');

    document.querySelectorAll('form').forEach(function(form) {
      if (!form.getAttribute('aria-label') && !form.getAttribute('aria-labelledby')) {
        form.setAttribute('aria-label', 'Formulario da comunidade escolar');
      }
    });

    document.querySelectorAll('input, select, textarea').forEach(function(field) {
      if (!field.id && field.name) field.id = 'field-' + String(field.name).replace(/[^a-zA-Z0-9_-]/g, '-');
      if (field.required && !field.getAttribute('aria-required')) field.setAttribute('aria-required', 'true');
      if (!field.getAttribute('autocomplete')) {
        var type = (field.getAttribute('type') || '').toLowerCase();
        var name = (field.getAttribute('name') || field.id || '').toLowerCase();
        if (type === 'email' || name.indexOf('email') >= 0) field.setAttribute('autocomplete', 'email');
        else if (name.indexOf('nome') >= 0 || name.indexOf('name') >= 0) field.setAttribute('autocomplete', 'name');
        else if (name.indexOf('senha') >= 0 || name.indexOf('password') >= 0) field.setAttribute('autocomplete', 'current-password');
      }
    });

    document.querySelectorAll('button:not([type])').forEach(function(button) {
      button.setAttribute('type', 'button');
    });
  });
})();
</script>

<script>
/* codex-project-behavior-standardization: microcomportamentos compartilhados */
(function() {
  if (window.__codexProjectBehaviorStandardization) return;
  window.__codexProjectBehaviorStandardization = true;

  var SUBMIT_LOCK_MS = 2500;
  var invalidFocusPending = false;

  function isElement(value) {
    return value && value.nodeType === 1;
  }

  function prefersReducedMotion() {
    return window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  }

  function unlockForm(form, button) {
    if (isElement(form)) {
      delete form.dataset.codexSubmitting;
      if (form.getAttribute('aria-busy') === 'true') form.setAttribute('aria-busy', 'false');
    }

    if (isElement(button) && button.dataset.codexSubmitLocked === 'true') {
      delete button.dataset.codexSubmitLocked;
      button.disabled = false;
      button.removeAttribute('aria-disabled');
    }
  }

  function restoreSubmitLocks(scope) {
    var root = scope && scope.querySelectorAll ? scope : document;

    root.querySelectorAll('form[data-codex-submitting="true"]').forEach(function(form) {
      unlockForm(form);
    });

    root.querySelectorAll('[data-codex-submit-locked="true"]').forEach(function(button) {
      unlockForm(null, button);
    });
  }

  document.addEventListener('submit', function(event) {
    var form = event.target;
    if (!isElement(form) || String(form.tagName).toLowerCase() !== 'form') return;
    if (form.hasAttribute('data-no-submit-lock')) return;

    if (form.dataset.codexSubmitting === 'true') {
      event.preventDefault();
      return;
    }

    if (typeof form.checkValidity === 'function' && !form.checkValidity()) return;

    form.dataset.codexSubmitting = 'true';
    form.setAttribute('aria-busy', 'true');

    var button = event.submitter || form.querySelector('button[type="submit"], input[type="submit"], button:not([type])');
    if (isElement(button) && !button.disabled && !button.hasAttribute('data-no-submit-lock')) {
      button.dataset.codexSubmitLocked = 'true';
      button.disabled = true;
      button.setAttribute('aria-disabled', 'true');
    }

    window.setTimeout(function() {
      unlockForm(form, button);
    }, SUBMIT_LOCK_MS);
  }, true);

  document.addEventListener('invalid', function(event) {
    var field = event.target;
    if (!isElement(field) || invalidFocusPending) return;
    invalidFocusPending = true;

    window.setTimeout(function() {
      invalidFocusPending = false;
      if (!document.documentElement.contains(field)) return;
      try {
        field.scrollIntoView({ block: 'center', inline: 'nearest', behavior: prefersReducedMotion() ? 'auto' : 'smooth' });
        field.focus({ preventScroll: true });
      } catch (error) {
        field.focus();
      }
    }, 0);
  }, true);

  document.addEventListener('keydown', function(event) {
    if (event.key !== 'Escape') return;
    var closedSomething = false;

    var dialogs = Array.prototype.slice.call(document.querySelectorAll('dialog[open]'));
    var dialog = dialogs[dialogs.length - 1];
    if (dialog && typeof dialog.close === 'function') {
      dialog.close();
      closedSomething = true;
    }

    if (!closedSomething) {
      var details = Array.prototype.slice.call(document.querySelectorAll('details[open]'));
      var detail = details[details.length - 1];
      if (detail) {
        detail.removeAttribute('open');
        closedSomething = true;
      }
    }

    document.querySelectorAll('[aria-expanded="true"]').forEach(function(toggle) {
      toggle.setAttribute('aria-expanded', 'false');
      closedSomething = true;
    });

    if (closedSomething) event.preventDefault();
  }, true);

  window.addEventListener('pageshow', function() {
    restoreSubmitLocks(document);
  });

  document.addEventListener('visibilitychange', function() {
    if (document.visibilityState === 'visible') restoreSubmitLocks(document);
  });
})();
</script>
