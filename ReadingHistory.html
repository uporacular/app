<!DOCTYPE html>
<html>
<head>
  <title>Reading History</title>
</head>
<body>
  <h1>Histórico de Leituras</h1>
  <div style="margin: 1.5em 0;">
    <label>Filtrar por categoria:
      <select style="margin-left: 0.5em;">
        <option>Todas</option>
        <option>Ficção</option>
        <option>Não Ficção</option>
        <option>Ciência</option>
      </select>
    </label>
  </div>
  <table style="width: 100%; border-collapse: collapse; background: #fff;">
    <thead>
      <tr style="background: #e3eafc;">
        <th style="padding: 0.5em;">Livro</th>
        <th style="padding: 0.5em;">Data</th>
        <th style="padding: 0.5em;">Categoria</th>
      </tr>
    </thead>
    <tbody>
      <tr><td>Exemplo 1</td><td>2026-03-01</td><td>Ficção</td></tr>
      <tr><td>Exemplo 2</td><td>2026-02-15</td><td>Ciência</td></tr>
    </tbody>
  </table>
</body>
</html>
