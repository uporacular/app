  TrailRecommender.html
  Interface para recomendação de trilhas personalizadas ao usuário.
  Exibe sugestões baseadas em perfil, histórico e preferências.
  Elementos típicos: listas de recomendações, botões de ação, feedback do usuário.
  Autor: [Seu Nome]

  Última modificação: [Data]
-->
<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Recomendar Trilhas</title>
  <style>
    body { font-family: 'Segoe UI', Arial, sans-serif; background: #f6f8fa; color: #222; margin: 0; padding: 2em; }
    .container { max-width: 340px; margin: 3em auto; background: #fff; border-radius: 10px; box-shadow: 0 2px 8px #0001; padding: 2em; }
    h2 { margin-top: 0; font-weight: 500; }
    ul { padding-left: 1.2em; }
    li { margin-bottom: 0.7em; }
    button { background: #2d8cff; color: #fff; border: none; border-radius: 5px; padding: 0.7em 1.5em; font-size: 1em; cursor: pointer; transition: background 0.2s; margin-top: 1em; }
    button:hover { background: #1a6ed8; }
  </style>
</head>
<body>
  <div class="container">
    <h2>Recomendar Trilhas</h2>
    <ul id="listaRec">
      <li>Carregue suas recomendações...</li>
    </ul>
    <button id="btnRec">Recomendar Novamente</button>
    <div id="msg" style="margin-top:1em;font-size:0.97em;"></div>
  </div>
<script>
  function renderRecs(data) {
    var ul = document.getElementById('listaRec');
    ul.innerHTML = '';
    if (!data || !data.recomendacoes || !data.recomendacoes.length) {
      ul.innerHTML = '<li>Nenhuma recomendação encontrada.</li>';
      return;
    }
    data.recomendacoes.forEach(function(r) {
      var li = document.createElement('li');
      li.innerHTML = '<b>' + r.titulo + '</b> <span style="color:#888">(' + r.categoria + ')</span><br><small>' + r.justificativa + '</small>';
      ul.appendChild(li);
    });
  }
  function gerarRecs() {
    var msg = document.getElementById('msg');
    msg.textContent = 'Buscando recomendações...';
    google.script.run.withSuccessHandler(function(data) {
      renderRecs(data);
      msg.textContent = data.mensagem || 'Recomendações atualizadas.';
    }).withFailureHandler(function(e) {
      msg.style.color = '#f87171';
      msg.textContent = 'Erro ao gerar recomendações: ' + e.message;
    }).getTrailRecommenderData();
  }
  document.getElementById('btnRec').onclick = gerarRecs;
  window.onload = gerarRecs;
</script>
</body>
</html>
