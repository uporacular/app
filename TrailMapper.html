<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Mapa de Trilhas</title>
  <style>
    body { font-family: 'Segoe UI', Arial, sans-serif; background: #f6f8fa; color: #222; margin: 0; padding: 2em; }
    .container { max-width: 340px; margin: 3em auto; background: #fff; border-radius: 10px; box-shadow: 0 2px 8px #0001; padding: 2em; }
    h2 { margin-top: 0; font-weight: 500; }
    p { margin: 1.2em 0; }
  </style>
</head>
<body>
  <div class="container">
    <h2>Mapa de Trilhas</h2>
    <p>Visualize conexões e caminhos entre diferentes áreas do conhecimento.</p>
    <div id="map" style="height: 220px; background: #e3eafc; border-radius: 8px; margin: 1em 0; display: flex; align-items: center; justify-content: center; color: #4a5; font-size: 1.1em;">
      [Mapa Interativo Placeholder]
    </div>
    <div style="display: flex; gap: 1em; justify-content: center;">
      <button style="padding: 0.5em 1.2em; border: none; background: #4a90e2; color: #fff; border-radius: 5px; cursor: pointer;">Nova Trilha</button>
      <button style="padding: 0.5em 1.2em; border: none; background: #7ed957; color: #fff; border-radius: 5px; cursor: pointer;">Editar</button>
      <button style="padding: 0.5em 1.2em; border: none; background: #e94e77; color: #fff; border-radius: 5px; cursor: pointer;">Remover</button>
    </div>
  </div>
