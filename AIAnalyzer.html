<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Análise com IA</title>
  <style>
    body { font-family: 'Segoe UI', Arial, sans-serif; background: #f6f8fa; color: #222; margin: 0; padding: 2em; }
    .container { max-width: 340px; margin: 3em auto; background: #fff; border-radius: 10px; box-shadow: 0 2px 8px #0001; padding: 2em; }
    h2 { margin-top: 0; font-weight: 500; }
    textarea { width: 100%; padding: 0.5em; border: 1px solid #ccc; border-radius: 5px; font-size: 1em; margin-top: 1em; }
    button { margin-top: 1.5em; background: #2d8cff; color: #fff; border: none; border-radius: 5px; padding: 0.7em 1.5em; font-size: 1em; cursor: pointer; transition: background 0.2s; }
    button:hover { background: #1a6ed8; }
  </style>
</head>
<body>
  <div class="container">
    <h2>Análise com IA</h2>
    <textarea id="textoIA" rows="3" placeholder="Descreva o que deseja analisar..."></textarea>
    <button id="btnIA">Analisar</button>
    <div id="msg" style="margin-top:1em;font-size:0.97em;"></div>
    <div id="spinner" style="display:none;margin-top:1em;text-align:center;">
      <span style="display:inline-block;width:24px;height:24px;border:3px solid #2d8cff33;border-top-color:#2d8cff;border-radius:50%;animation:spin .7s linear infinite;"></span>
    </div>
  </div>
  <script>
    function showSpinner(show) {
      document.getElementById('spinner').style.display = show ? '' : 'none';
    }
    function showMsg(text, isError) {
      var msg = document.getElementById('msg');
      msg.style.color = isError ? '#f87171' : '#222';
      msg.innerHTML = text;
    }
    document.getElementById('btnIA').onclick = function() {
      var texto = document.getElementById('textoIA').value.trim();
      if (!texto) { showMsg('Digite um texto para analisar.', true); return; }
      showSpinner(true);
      showMsg('Analisando...', false);
      google.script.run
        .withSuccessHandler(function(res) {
          showSpinner(false);
          showMsg(res, false);
        })
        .withFailureHandler(function(e) {
          showSpinner(false);
          showMsg('Erro na análise: ' + e.message, true);
        })
        .analyzeTextWithAI(texto);
    };
    // Spinner CSS
    var style = document.createElement('style');
    style.innerHTML = '@keyframes spin { to { transform: rotate(360deg); } }';
    document.head.appendChild(style);
  </script>
</body>
</html>
