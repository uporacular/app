<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Validar Usuário</title>
  <style>
    body { font-family: 'Segoe UI', Arial, sans-serif; background: #f6f8fa; color: #222; margin: 0; padding: 2em; }
    .container { max-width: 340px; margin: 3em auto; background: #fff; border-radius: 10px; box-shadow: 0 2px 8px #0001; padding: 2em; }
    h2 { margin-top: 0; font-weight: 500; }
    label { display: block; margin-top: 1em; font-size: 0.97em; }
    input { width: 100%; padding: 0.5em; margin-top: 0.3em; border: 1px solid #ccc; border-radius: 5px; font-size: 1em; }
    button { margin-top: 1.5em; background: #2d8cff; color: #fff; border: none; border-radius: 5px; padding: 0.7em 1.5em; font-size: 1em; cursor: pointer; transition: background 0.2s; }
    button:hover { background: #1a6ed8; }
  </style>
</head>
<body>
  <div class="container">
    <h2>Validar Usuário</h2>
    <label>Email
      <input id="email" type="email" placeholder="seu@email.com">
    </label>
    <button id="btnValidar">Validar</button>
    <div id="msg" style="margin-top:1em;font-size:0.97em;"></div>
  </div>
<script>
  document.getElementById('btnValidar').onclick = function() {
    var email = document.getElementById('email').value.trim();
    var msg = document.getElementById('msg');
    if (!email) {
      msg.style.color = '#f87171';
      msg.textContent = 'Digite um e-mail.';
      return;
    }
    msg.style.color = '#222';
    msg.textContent = 'Validando...';
    google.script.run.withSuccessHandler(function(isValid) {
      if (isValid) {
        msg.style.color = '#4ade80';
        msg.textContent = 'Usuário válido!';
      } else {
        msg.style.color = '#f87171';
        msg.textContent = 'Usuário não encontrado ou não autorizado.';
      }
    }).withFailureHandler(function(e) {
      msg.style.color = '#f87171';
      msg.textContent = 'Erro ao validar: ' + e.message;
    }).isValidUser(email);
  };
</script>
</body>
</html>
